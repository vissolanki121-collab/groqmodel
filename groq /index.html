    // --- MARKDOWN & CITATION RENDERER ---
    function MarkdownRenderer({ content, onCitationClick }) {
      const [copiedBlock, setCopiedBlock] = useState(null);

      const copyCode = (code, idx) => {
        navigator.clipboard.writeText(code);
        setCopiedBlock(idx);
        setTimeout(() => setCopiedBlock(null), 2000);
      };

      const parts = content.split(/(```[\s\S]*?```)/g);

      return (
        <div className="space-y-3 text-sm leading-relaxed text-gray-200">
          {parts.map((part, idx) => {
            if (part.startsWith('```') && part.endsWith('```')) {
              const firstNewline = part.indexOf('\n');
              let lang = 'code';
              let code = '';
              if (firstNewline !== -1) {
                lang = part.slice(3, firstNewline).trim() || 'code';
                code = part.slice(firstNewline + 1, -3);
              } else {
                code = part.slice(3, -3);
              }

              return (
                <div key={idx} className="my-3 rounded-lg border border-groq-border bg-[#0d0f17] overflow-hidden">
                  <div className="flex items-center justify-between px-3.5 py-1.5 bg-[#141724] border-b border-groq-border text-xs font-mono text-gray-400">
                    <span className="uppercase text-[11px] font-semibold text-orange-400">{lang}</span>
                    <button
                      onClick={() => copyCode(code, idx)}
                      className="flex items-center gap-1.5 px-2 py-0.5 rounded text-gray-300 hover:text-white hover:bg-gray-800 transition-colors"
                      title="Copy snippet"
                    >
                      {copiedBlock === idx ? (
                        <>
                          <IconCheck className="w-3.5 h-3.5 text-emerald-400" />
                          <span className="text-emerald-400 text-[11px]">Copied</span>
                        </>
                      ) : (
                        <>
                          <IconCopy className="w-3.5 h-3.5" />
                          <span className="text-[11px]">Copy</span>
                        </>
                      )}
                    </button>
                  </div>
                  <pre className="p-3.5 text-xs font-mono text-emerald-300/90 overflow-x-auto leading-relaxed">
                    <code>{code}</code>
                  </pre>
                </div>
              );
            }

            // Normal paragraphs
            return (
              <div key={idx} className="space-y-2">
                {part.split('\n\n').map((paragraph, pIdx) => {
                  const trimmed = paragraph.trim();
                  if (!trimmed) return null;

                  if (trimmed.startsWith('### ')) {
                    return <h3 key={pIdx} className="text-base font-bold text-white mt-3">{renderInline(trimmed.slice(4), onCitationClick)}</h3>;
                  }
                  if (trimmed.startsWith('## ')) {
                    return <h2 key={pIdx} className="text-lg font-bold text-white mt-4">{renderInline(trimmed.slice(3), onCitationClick)}</h2>;
                  }
                  if (trimmed.startsWith('# ')) {
                    return <h1 key={pIdx} className="text-xl font-bold text-white mt-4">{renderInline(trimmed.slice(2), onCitationClick)}</h1>;
                  }

                  const lines = paragraph.split('\n');
                  const isList = lines.every(l => l.trim().startsWith('- ') || l.trim().startsWith('* ') || /^\d+\.\s/.test(l.trim()));
                  if (isList) {
                    return (
                      <ul key={pIdx} className="space-y-1.5 pl-2 my-2">
                        {lines.map((l, lIdx) => (
                          <li key={lIdx} className="flex items-start gap-2">
                            <span className="text-orange-400 mt-1 select-none">•</span>
                            <span className="flex-1">{renderInline(l.replace(/^[-*]\s+|\d+\.\s+/, ''), onCitationClick)}</span>
                          </li>
                        ))}
                      </ul>
                    );
                  }

                  return (
                    <p key={pIdx} className="text-gray-300 leading-relaxed">
                      {renderInline(paragraph, onCitationClick)}
                    </p>
                  );
                })}
              </div>
            );
          })}
        </div>
      );
    }

    function renderInline(text, onCitationClick) {
      const regex = /(\*\*.*?\*\*|`.*?`|\[\d+\])/g;
      const parts = text.split(regex);
      return parts.map((seg, i) => {
        if (seg.startsWith('**') && seg.endsWith('**')) {
          return <strong key={i} className="font-semibold text-white">{seg.slice(2, -2)}</strong>;
        }
        if (seg.startsWith('`') && seg.endsWith('`')) {
          return <code key={i} className="px-1.5 py-0.5 rounded bg-groq-card border border-groq-border text-orange-300 font-mono text-[12px]">{seg.slice(1, -1)}</code>;
        }
        if (/^\[\d+\]$/.test(seg)) {
          const num = parseInt(seg.slice(1, -1), 10);
          return (
            <button
              key={i}
              type="button"
              onClick={() => onCitationClick && onCitationClick(num)}
              className="inline-flex items-center justify-center px-1.5 py-0.2 mx-0.5 rounded text-[11px] font-mono font-bold bg-purple-500/20 text-purple-300 border border-purple-500/40 hover:bg-purple-500/40 hover:text-white transition-colors align-super cursor-pointer"
              title={`View Source [${num}]`}
            >
              {num}
            </button>
          );
        }
        return seg;
      });
    }

      useEffect(() => {
        chatEndRef.current?.scrollIntoView({ behavior: 'smooth' });
      }, [messages, streamingDelta, isGenerating, isSearching]);

      // Validate and Connect API Key
      const handleConnectKey = async (keyToValidate) => {
        const clean = keyToValidate.trim();
        if (!clean) return { success: false, error: 'API key cannot be empty' };

        try {
          const res = await fetch('https://api.groq.com/openai/v1/models', {
            method: 'GET',
            headers: {
              'Authorization': `Bearer ${clean}`,
              'Content-Type': 'application/json'
            }
          });

          if (res.status === 401) {
            return { success: false, error: 'Invalid API Key (401 Unauthorized). Please check your key at console.groq.com/keys' };
          }
          if (!res.ok) {
            return { success: false, error: `Groq API Error (${res.status} ${res.statusText})` };
          }

          const data = await res.json();
          if (Array.isArray(data.data)) {
            const fetched = data.data
              .filter(m => m.id && !m.id.includes('whisper'))
              .map(m => {
                const def = DEFAULT_MODELS.find(d => d.id === m.id);
                return {
                  id: m.id,
                  name: def?.name || m.id,
                  context: def?.context || (m.context_window ? `${Math.round(m.context_window/1024)}K` : '8K'),
                  badge: def?.badge || 'Available',
                  category: def?.category || 'other'
                };
              });
            if (fetched.length > 0) {
              setModels(fetched);
            }
          }

          setApiKey(clean);
          setIsConnected(true);
          return { success: true };
        } catch (err) {
          return { success: false, error: `Network error: Failed to reach api.groq.com (${err.message})` };
        }
      };

      const handleDisconnect = () => {
        setApiKey('');
        setIsConnected(false);
        setIsKeyModalOpen(true);
      };

      // Example Management
      const addExample = () => {
        const newEx = {
          id: 'ex-' + Date.now(),
          userInput: '',
          assistantResponse: ''
        };
        setExamples([...examples, newEx]);
      };

      const updateExample = (id, field, value) => {
        setExamples(examples.map(ex => ex.id === id ? { ...ex, [field]: value } : ex));
      };

      const deleteExample = (id) => {
        setExamples(examples.filter(ex => ex.id !== id));
      };

      const clearAllExamples = () => {
        setExamples([]);
      };

      const loadPreset = (presetKey) => {
        const p = PRESET_TEMPLATES[presetKey];
        if (!p) return;
        setSystemPrompt(p.systemPrompt);
        setExamples(p.examples);
        if (p.sampleInput) setUserPrompt(p.sampleInput);
      };

      // Real Web Search Engine (Wikipedia API CORS + DuckDuckGo CORS search)
      const performWebSearch = async (query) => {
        try {
          // Direct Wikipedia CORS API: instant, accurate, CORS origin:* enabled
          const res = await fetch(`https://en.wikipedia.org/w/api.php?action=query&list=search&srsearch=${encodeURIComponent(query)}&format=json&origin=*`);
          if (!res.ok) throw new Error('Search failed');
          const data = await res.json();
          if (data?.query?.search && Array.isArray(data.query.search)) {
            return data.query.search.slice(0, 4).map(item => ({
              title: item.title,
              url: `https://en.wikipedia.org/wiki/${encodeURIComponent(item.title.replace(/\s+/g, '_'))}`,
              snippet: item.snippet.replace(/<[^>]+>/g, '').replace(/&quot;/g, '"').replace(/&#039;/g, "'").trim()
            }));
          }
          return [];
        } catch (e) {
          console.warn('Search fallback error:', e);
          return [];
        }
      };

      // Stop Generation
      const handleStopGeneration = () => {
        if (abortControllerRef.current) {
          abortControllerRef.current.abort();
          abortControllerRef.current = null;
        }
        setIsGenerating(false);
        setIsSearching(false);
      };

      // Clear Conversation
      const handleClearConversation = () => {
        if (isGenerating) handleStopGeneration();
        setMessages([]);
        setStreamingDelta('');
        setStreamingStats(null);
        setActiveSources([]);
      };

      // Send / Generate Message
      const handleSendMessage = async () => {
        const trimmedInput = userPrompt.trim();
        if (!trimmedInput) return;
        if (!apiKey || !isConnected) {
          setIsKeyModalOpen(true);
          return;
        }

        const userMsg = {
          id: 'user-' + Date.now(),
          role: 'user',
          content: trimmedInput,
          timestamp: Date.now()
        };

        const updatedHistory = [...messages, userMsg];
        setMessages(updatedHistory);
        setUserPrompt('');
        setIsGenerating(true);
        setStreamingDelta('');
        setStreamingStats(null);

        // Web Search Step (if enabled)
        let foundSources = [];
        if (webSearchEnabled) {
          setIsSearching(true);
          foundSources = await performWebSearch(trimmedInput);
          setIsSearching(false);
          setActiveSources(foundSources);
        } else {
          setActiveSources([]);
        }

        // Build Payload
        const apiMessages = [];

        // 1. System Prompt + Search Context
        let finalSysPrompt = systemPrompt.trim();
        if (foundSources.length > 0) {
          const searchBlock = foundSources.map((s, idx) => 
            `[${idx + 1}] Title: ${s.title}\nURL: ${s.url}\nExcerpt: ${s.snippet}`
          ).join('\n\n');
          finalSysPrompt += `\n\n[LIVE SEARCH SOURCES]\n${searchBlock}\n\nInstructions: Use these real-world sources to answer accurately. Cite sources in your response using bracketed numbers like [1], [2] matching the references above.`;
        }

        if (finalSysPrompt) {
          apiMessages.push({ role: 'system', content: finalSysPrompt });
        }

        // 2. Few-shot Examples from Left Sidebar
        examples.forEach(ex => {
          if (ex.userInput.trim() && ex.assistantResponse.trim()) {
            apiMessages.push({ role: 'user', content: ex.userInput.trim() });
            apiMessages.push({ role: 'assistant', content: ex.assistantResponse.trim() });
          }
        });

        // 3. User History
        updatedHistory.forEach(m => {
          apiMessages.push({ role: m.role, content: m.content });
        });

        // Initialize Abort Controller
        abortControllerRef.current = new AbortController();
        const signal = abortControllerRef.current.signal;
        const startTime = performance.now();
        let fullGeneratedText = '';

        try {
          const reqBody = {
            model: selectedModel,
            messages: apiMessages,
            temperature: parameters.temperature,
            max_tokens: parameters.maxTokens,
            top_p: parameters.topP,
            frequency_penalty: parameters.frequencyPenalty,
            presence_penalty: parameters.presencePenalty,
            stream: parameters.stream
          };

          if (parameters.stream) {
            reqBody.stream_options = { include_usage: true };
          }

          const response = await fetch('https://api.groq.com/openai/v1/chat/completions', {
            method: 'POST',
            headers: {
              'Authorization': `Bearer ${apiKey.trim()}`,
              'Content-Type': 'application/json'
            },
            body: JSON.stringify(reqBody),
            signal
          });

          if (!response.ok) {
            const errText = await response.text();
            let msg = `API Error ${response.status}: ${response.statusText}`;
            try {
              const j = JSON.parse(errText);
              msg = j.error?.message || msg;
            } catch (e) {}
            throw new Error(msg);
          }

          // Non-Streaming Mode
          if (!parameters.stream) {
            const data = await response.json();
            const text = data.choices?.[0]?.message?.content || '';
            const totalDurationSec = (performance.now() - startTime) / 1000;
            const completionTokens = data.usage?.completion_tokens || Math.round(text.length / 4);

            const stats = {
              tokens: completionTokens,
              duration: totalDurationSec.toFixed(2),
              tps: Math.round(completionTokens / (totalDurationSec || 0.001))
            };

            setMessages([...updatedHistory, {
              id: 'assistant-' + Date.now(),
              role: 'assistant',
              content: text,
              timestamp: Date.now(),
              sources: foundSources,
              stats
            }]);
            setIsGenerating(false);
            return;
          }

          // Streaming Mode (SSE)
          const reader = response.body.getReader();
          const decoder = new TextDecoder('utf-8');
          let buffer = '';
          let usageData = null;

          while (true) {
            const { done, value } = await reader.read();
            if (done) break;

            buffer += decoder.decode(value, { stream: true });
            const lines = buffer.split('\n');
            buffer = lines.pop() || '';

            for (const line of lines) {
              const t = line.trim();
              if (!t || t.startsWith(':')) continue;
              if (t === 'data: [DONE]') continue;

              if (t.startsWith('data: ')) {
                try {
                  const chunk = JSON.parse(t.slice(6));
                  const delta = chunk.choices?.[0]?.delta?.content;
                  if (delta) {
                    fullGeneratedText += delta;
                    setStreamingDelta(fullGeneratedText);
                  }
                  if (chunk.usage) {
                    usageData = chunk.usage;
                  }
                } catch (e) {}
              }
            }
          }

          const totalDurationSec = (performance.now() - startTime) / 1000;
          const tokensCount = usageData?.completion_tokens || Math.max(1, Math.round(fullGeneratedText.length / 3.8));
          const tps = Math.round(tokensCount / (usageData?.completion_time || totalDurationSec || 0.001));

          const finalStats = {
            tokens: tokensCount,
            duration: (usageData?.completion_time || totalDurationSec).toFixed(2),
            tps
          };

          setMessages([...updatedHistory, {
            id: 'assistant-' + Date.now(),
            role: 'assistant',
            content: fullGeneratedText,
            timestamp: Date.now(),
            sources: foundSources,
            stats: finalStats
          }]);
          setStreamingDelta('');
          setStreamingStats(null);
        } catch (err) {
          if (err.name === 'AbortError') {
            // User stopped generation gracefully
            if (fullGeneratedText) {
              setMessages([...updatedHistory, {
                id: 'assistant-' + Date.now(),
                role: 'assistant',
                content: fullGeneratedText + ' \n\n*(Generation stopped by user)*',
                timestamp: Date.now(),
                sources: foundSources
              }]);
            }
          } else {
            // Append error message to chat
            setMessages([...updatedHistory, {
              id: 'error-' + Date.now(),
              role: 'assistant',
              content: `⚠️ **Groq Error:** ${err.message}`,
              timestamp: Date.now(),
              isError: true
            }]);
          }
          setStreamingDelta('');
        } finally {
          setIsGenerating(false);
          setIsSearching(false);
          abortControllerRef.current = null;
        }
      };

      // Copy text helper
      const [copiedChatId, setCopiedChatId] = useState(null);
      const handleCopyText = (text, id) => {
        navigator.clipboard.writeText(text);
        setCopiedChatId(id);
        setTimeout(() => setCopiedChatId(null), 2000);
      };

      return (
        <div className="flex flex-col h-screen bg-[#090a0f] text-gray-200">

          <header className="flex items-center justify-between px-4 lg:px-6 py-2.5 bg-[#10121a] border-b border-groq-border shrink-0 z-20">

                <div>

                    <span className="px-1.5 py-0.5 rounded text-[10px] font-mono font-semibold bg-orange-500/20 text-orange-400 border border-orange-500/30">
                      PLAYGROUND
                    </span>
                  </div>
                  <p className="text-[11px] text-gray-400 hidden sm:block">Ultra-Fast LPU Inference Studio</p>
                </div>
              </div>

              {/* Active Prompting Technique Badge in Header */}
              <div className={`hidden md:flex items-center gap-1.5 px-2.5 py-1 rounded-full border text-xs font-semibold ${technique.badgeBg} ${technique.badgeBorder} ${technique.badgeText} transition-all`}>
                <span className="w-1.5 h-1.5 rounded-full bg-current animate-pulse"></span>
                <span>{technique.label}</span>
                <span className="text-[10px] text-gray-400 font-normal">({examples.length} {examples.length === 1 ? 'example' : 'examples'})</span>
              </div>
            </div>

            {/* Header Right Actions */}
            <div className="flex items-center gap-2 sm:gap-3">
              {/* Web Search Quick Indicator */}
              <button
                onClick={() => setWebSearchEnabled(!webSearchEnabled)}
                className={`flex items-center gap-1.5 px-2.5 py-1.5 rounded-lg text-xs font-medium border transition-colors ${
                  webSearchEnabled
                    ? 'bg-emerald-500/15 border-emerald-500/40 text-emerald-400 shadow-sm shadow-emerald-500/10'
                    : 'bg-groq-panel border-groq-border text-gray-400 hover:text-gray-300'
                }`}
                title="Toggle Web Search"
              >
                <IconGlobe className={`w-3.5 h-3.5 ${webSearchEnabled ? 'text-emerald-400 animate-spin-slow' : 'text-gray-400'}`} />
                <span className="hidden sm:inline">Web Search:</span>
                <span className="font-semibold">{webSearchEnabled ? 'ON' : 'OFF'}</span>
              </button>

              {/* Code Export Button */}
              <button
                onClick={() => setIsCodeModalOpen(true)}
                className="flex items-center gap-1.5 px-2.5 py-1.5 rounded-lg text-xs font-medium bg-groq-card hover:bg-[#1f2333] border border-groq-border text-gray-300 hover:text-white transition-colors"
                title="Export Code (cURL, Python, JS)"
              >
                <IconCode className="w-3.5 h-3.5 text-purple-400" />
                <span className="hidden sm:inline">View Code</span>
              </button>

              {/* API Key Status Pill & Button */}
              <button
                onClick={() => setIsKeyModalOpen(true)}
                className={`flex items-center gap-2 px-3 py-1.5 rounded-lg text-xs font-medium border transition-colors ${
                  isConnected
                    ? 'bg-[#121924] border-emerald-500/30 text-emerald-300 hover:bg-[#162232]'
                    : 'bg-red-500/15 border-red-500/40 text-red-300 hover:bg-red-500/25 pulse-glow'
                }`}
              >
                <span className={`w-2 h-2 rounded-full ${isConnected ? 'bg-emerald-400' : 'bg-red-400 animate-ping'}`} />
                <span className="font-semibold">{isConnected ? 'Connected' : 'Connect Key'}</span>
                <IconKey className="w-3.5 h-3.5 opacity-70" />
              </button>
            </div>
          </header>

          {/* MOBILE NAVIGATION TABS (Visible on screens < lg) */}
          <div className="flex lg:hidden bg-groq-panel border-b border-groq-border text-xs font-medium">
            <button
              onClick={() => setActiveMobileTab('examples')}
              className={`flex-1 py-2 text-center border-b-2 transition-colors ${
                activeMobileTab === 'examples' ? 'border-orange-500 text-orange-400 bg-orange-500/10' : 'border-transparent text-gray-400'
              }`}
            >
              Examples ({examples.length})
            </button>
            <button
              onClick={() => setActiveMobileTab('playground')}
              className={`flex-1 py-2 text-center border-b-2 transition-colors ${
                activeMobileTab === 'playground' ? 'border-orange-500 text-orange-400 bg-orange-500/10' : 'border-transparent text-gray-400'
              }`}
            >
              Playground
            </button>
            <button
              onClick={() => setActiveMobileTab('parameters')}
              className={`flex-1 py-2 text-center border-b-2 transition-colors ${
                activeMobileTab === 'parameters' ? 'border-orange-500 text-orange-400 bg-orange-500/10' : 'border-transparent text-gray-400'
              }`}
            >
              Parameters
            </button>
          </div>

          {/* THREE-COLUMN MAIN WORKSPACE */}
          <div className="flex-1 flex overflow-hidden">
            
            {/* ========================================================= */}
            {/* LEFT SIDEBAR: Prompt Examples & System Prompt             */}
            {/* ========================================================= */}
            <aside className={`w-full lg:w-80 xl:w-96 bg-[#0d0f17] border-r border-groq-border flex flex-col shrink-0 overflow-y-auto ${
              activeMobileTab === 'examples' ? 'block' : 'hidden lg:flex'
            }`}>
              
              {/* Sidebar Header with Prompting Technique Box */}
              <div className="p-4 border-b border-groq-border bg-[#10131e] space-y-3">
                <div className="flex items-center justify-between">
                  <h2 className="text-xs font-bold uppercase tracking-wider text-gray-300">Prompting Mode</h2>
                  <span className="text-[11px] font-mono text-gray-400">{examples.length} {examples.length === 1 ? 'Example' : 'Examples'}</span>
                </div>

                {/* Prompting Technique Highlight Card */}
                <div className={`p-3 rounded-lg border ${technique.badgeBg} ${technique.badgeBorder} transition-all`}>
                  <div className="flex items-center justify-between mb-1">
                    <span className={`text-xs font-bold ${technique.badgeText} flex items-center gap-1.5`}>
                      <span className="w-2 h-2 rounded-full bg-current"></span>
                      {technique.label} Prompting
                    </span>
                    <span className="text-[10px] font-mono px-1.5 py-0.5 rounded bg-black/40 text-gray-300 border border-white/10">
                      {examples.length} shot
                    </span>
                  </div>
                  <p className="text-[11px] text-gray-300 leading-snug">{technique.desc}</p>
                </div>

                {/* Preset Templates Selector */}
                <div>
                  <label className="block text-[11px] font-semibold text-gray-400 mb-1">Load Preset Template</label>
                  <select
                    onChange={(e) => {
                      if (e.target.value) loadPreset(e.target.value);
                      e.target.value = '';
                    }}
                    defaultValue=""
                    className="w-full px-2.5 py-1.5 bg-[#161a26] border border-groq-border rounded-lg text-xs text-gray-300 focus:outline-none focus:border-orange-500 cursor-pointer"
                  >
                    <option value="" disabled>-- Select an example preset --</option>
                    <option value="sentiment">Sentiment Analysis (3 Examples → Few-shot)</option>
                    <option value="codeTranslation">Python to TypeScript (1 Example → One-shot)</option>
                    <option value="jsonExtractor">Meeting Notes Extractor (2 Examples → Few-shot)</option>
                    <option value="zeroShot">Clear to Zero-shot (0 Examples)</option>
                  </select>
                </div>
              </div>

              {/* System Prompt Section */}
              <div className="p-4 border-b border-groq-border space-y-2">
                <div className="flex items-center justify-between">
                  <label className="text-xs font-semibold text-gray-300 flex items-center gap-1.5">
                    <span className="w-1.5 h-1.5 rounded-full bg-purple-400"></span>
                    System Prompt
                  </label>
                  <span className="text-[10px] text-gray-400">Behavior & Persona</span>
                </div>
                <textarea
                  value={systemPrompt}
                  onChange={(e) => setSystemPrompt(e.target.value)}
                  rows={3}
                  placeholder="Set instructions for model tone, formatting, constraints..."
                  className="w-full px-3 py-2 bg-[#141724] border border-groq-border rounded-lg text-xs text-white placeholder-gray-500 focus:outline-none focus:border-orange-500 font-sans resize-y"
                />
              </div>

              {/* Few-Shot Examples Section */}
              <div className="flex-1 p-4 space-y-4">
                <div className="flex items-center justify-between">
                  <div className="flex items-center gap-1.5">
                    <span className="text-xs font-bold uppercase tracking-wider text-gray-300">Examples</span>
                    <span className="px-1.5 py-0.2 rounded-full text-[10px] font-mono bg-groq-card border border-groq-border text-gray-300">
                      {examples.length}
                    </span>
                  </div>
                  <div className="flex items-center gap-1">
                    {examples.length > 0 && (
                      <button

                        className="px-2 py-1 text-[11px] text-red-400 hover:text-red-300 hover:bg-red-500/10 rounded transition-colors"

                    <button

                    <button

                    >
                      <IconPlus className="w-3.5 h-3.5 text-orange-400" />
                      Add First Example

                  </div>
                )}

                {/* Example Cards List */}
                <div className="space-y-3">
                  {examples.map((ex, idx) => (

                            {idx + 1}
                          </span>
                          Example Pair
                        </span>
                        <button

                          className="p-1 rounded text-gray-500 hover:text-red-400 hover:bg-red-500/10 transition-colors"
                          title="Delete example"
                        >
                          <IconTrash className="w-3.5 h-3.5" />
                        </button>
                      </div>

                      {/* User Input in Example */}
                      <div className="space-y-1">
                        <span className="text-[10px] font-semibold uppercase tracking-wider text-cyan-400">User Input</span>
                        <textarea
                          value={ex.userInput}

                        />

                      {/* Expected Assistant Response */}
                      <div className="space-y-1">
                        <span className="text-[10px] font-semibold uppercase tracking-wider text-emerald-400">Expected Assistant Output</span>
                        <textarea

                {/* Real-time Streaming Response Display */}
                {isGenerating && streamingDelta && (

                        if (!isGenerating) handleSendMessage();

                    <div className="flex items-center gap-2">

                        >
                          <IconSquare className="w-3.5 h-3.5" />
                          <span>Stop</span>
                        </button>
                      ) : (
                        <button
                          onClick={handleSendMessage}
                          disabled={!userPrompt.trim()}
                          className="flex items-center gap-1.5 px-5 py-2 text-xs font-bold text-white gradient-groq hover:brightness-110 active:scale-95 disabled:opacity-40 disabled:cursor-not-allowed rounded-lg shadow-lg shadow-orange-500/20 transition-all cursor-pointer"
                        >
                          <IconPlay className="w-3.5 h-3.5" />
                          <span>Generate</span>
                        </button>

                    </div>
                  </div>
                </div>
              </div>
            </main>

            {/* ========================================================= */}
            {/* RIGHT SIDEBAR: Model Parameters Settings                  */}
            {/* ========================================================= */}
            <aside className={`w-full lg:w-72 xl:w-80 bg-[#0d0f17] border-l border-groq-border flex flex-col shrink-0 overflow-y-auto ${
              activeMobileTab === 'parameters' ? 'block' : 'hidden lg:flex'
            }`}>
              
              <div className="p-4 border-b border-groq-border bg-[#10131e] flex items-center justify-between">
                <div className="flex items-center gap-2">
                  <IconSliders className="w-4 h-4 text-orange-400" />
                  <h2 className="text-xs font-bold uppercase tracking-wider text-gray-200">Model Parameters</h2>
                </div>
                <button
                  onClick={() => setParameters({
                    temperature: 0.7,
                    maxTokens: 2048,
                    topP: 1.0,
                    frequencyPenalty: 0.0,
                    presencePenalty: 0.0,
                    stream: true
                  })}
                  className="text-[11px] text-gray-400 hover:text-orange-400 transition-colors"
                  title="Reset to defaults"
                >
                  Reset
                </button>
              </div>

              <div className="p-4 space-y-6 flex-1 text-xs">
                
                {/* 1. TEMPERATURE */}
                <div className="space-y-1.5">
                  <div className="flex items-center justify-between">
                    <label className="font-semibold text-gray-200">Temperature</label>
                    <span className="font-mono text-orange-400 font-bold px-1.5 py-0.5 rounded bg-black/40 border border-groq-border">
                      {parameters.temperature}
                    </span>
                  </div>
                  <input
                    type="range"
                    min="0"
                    max="2"
                    step="0.05"
                    value={parameters.temperature}
                    onChange={(e) => setParameters({ ...parameters, temperature: parseFloat(e.target.value) })}
                    className="w-full accent-orange-500 cursor-pointer"
                  />
                  <p className="text-[11px] text-gray-400 leading-tight">
                    Controls response randomness. Lower values are deterministic and focused; higher values are creative.
                  </p>
                </div>

                {/* 2. MAXIMUM TOKENS */}
                <div className="space-y-1.5">
                  <div className="flex items-center justify-between">
                    <label className="font-semibold text-gray-200">Max Tokens</label>
                    <input
                      type="number"
                      min="1"
                      max="8192"
                      value={parameters.maxTokens}
                      onChange={(e) => setParameters({ ...parameters, maxTokens: parseInt(e.target.value) || 100 })}
                      className="w-20 px-2 py-0.5 bg-black/40 border border-groq-border rounded font-mono text-orange-400 font-bold text-right text-xs focus:outline-none focus:border-orange-500"
                    />
                  </div>
                  <input
                    type="range"
                    min="64"
                    max="8192"
                    step="64"
                    value={parameters.maxTokens}
                    onChange={(e) => setParameters({ ...parameters, maxTokens: parseInt(e.target.value) })}
                    className="w-full accent-orange-500 cursor-pointer"
                  />
                  <p className="text-[11px] text-gray-400 leading-tight">
                    Controls the maximum response length. Token limits are respected per model context window.
                  </p>
                </div>

                {/* 3. TOP P */}
                <div className="space-y-1.5">
                  <div className="flex items-center justify-between">
                    <label className="font-semibold text-gray-200">Top P</label>
                    <span className="font-mono text-orange-400 font-bold px-1.5 py-0.5 rounded bg-black/40 border border-groq-border">
                      {parameters.topP}
                    </span>
                  </div>
                  <input
                    type="range"
                    min="0"
                    max="1"
                    step="0.05"
                    value={parameters.topP}
                    onChange={(e) => setParameters({ ...parameters, topP: parseFloat(e.target.value) })}
                    className="w-full accent-orange-500 cursor-pointer"
                  />
                  <p className="text-[11px] text-gray-400 leading-tight">
                    Nucleus sampling: considers tokens comprising the top P probability mass. Alternative to temperature.
                  </p>
                </div>

                {/* 4. FREQUENCY PENALTY */}
                <div className="space-y-1.5">
                  <div className="flex items-center justify-between">
                    <label className="font-semibold text-gray-200">Frequency Penalty</label>
                    <span className="font-mono text-orange-400 font-bold px-1.5 py-0.5 rounded bg-black/40 border border-groq-border">
                      {parameters.frequencyPenalty}
                    </span>
                  </div>
                  <input
                    type="range"
                    min="-2"
                    max="2"
                    step="0.1"
                    value={parameters.frequencyPenalty}
                    onChange={(e) => setParameters({ ...parameters, frequencyPenalty: parseFloat(e.target.value) })}
                    className="w-full accent-orange-500 cursor-pointer"
                  />
                  <p className="text-[11px] text-gray-400 leading-tight">
                    Penalizes tokens based on their frequency in text so far, reducing verbatim repetition.
                  </p>
                </div>

                {/* 5. PRESENCE PENALTY */}
                <div className="space-y-1.5">
                  <div className="flex items-center justify-between">
                    <label className="font-semibold text-gray-200">Presence Penalty</label>
                    <span className="font-mono text-orange-400 font-bold px-1.5 py-0.5 rounded bg-black/40 border border-groq-border">
                      {parameters.presencePenalty}
                    </span>
                  </div>
                  <input
                    type="range"
                    min="-2"
                    max="2"
                    step="0.1"
                    value={parameters.presencePenalty}
                    onChange={(e) => setParameters({ ...parameters, presencePenalty: parseFloat(e.target.value) })}
                    className="w-full accent-orange-500 cursor-pointer"
                  />
                  <p className="text-[11px] text-gray-400 leading-tight">
                    Penalizes tokens based on whether they appear in text at all, encouraging novel topics.
                  </p>
                </div>

                {/* 6. STREAMING TOGGLE */}
                <div className="pt-2 border-t border-groq-border flex items-center justify-between">
                  <div>
                    <label className="font-semibold text-gray-200 block">Stream Output</label>
                    <span className="text-[10px] text-gray-400">Stream tokens in real-time</span>
                  </div>
                  <button
                    onClick={() => setParameters({ ...parameters, stream: !parameters.stream })}
                    className={`relative inline-flex h-5 w-9 shrink-0 cursor-pointer rounded-full border-2 border-transparent transition-colors duration-200 ease-in-out ${
                      parameters.stream ? 'bg-orange-500' : 'bg-gray-700'
                    }`}
                  >
                    <span className={`pointer-events-none inline-block h-4 w-4 transform rounded-full bg-white shadow ring-0 transition duration-200 ease-in-out ${
                      parameters.stream ? 'translate-x-4' : 'translate-x-0'
                    }`} />
                  </button>
                </div>

                {/* Active Model Info Card */}
                <div className="p-3 rounded-lg bg-[#121520] border border-groq-border space-y-1.5 text-[11px]">
                  <span className="font-bold text-gray-300 block">Active Model Specs</span>
                  <div className="flex justify-between text-gray-400">
                    <span>ID:</span>
                    <span className="font-mono text-white text-[10px] truncate max-w-[150px]">{selectedModel}</span>
                  </div>
                  <div className="flex justify-between text-gray-400">
                    <span>Architecture:</span>
                    <span className="text-gray-300 font-mono">Groq LPU Tensor</span>
                  </div>
                  <div className="flex justify-between text-gray-400">
                    <span>Context Window:</span>
                    <span className="text-orange-400 font-mono">128,000 tokens</span>
                  </div>
                </div>

              </div>
            </aside>
          </div>

          {/* ========================================================= */}
          {/* API KEY CONNECTION MODAL                                  */}
          {/* ========================================================= */}
          {isKeyModalOpen && (
            <ApiKeyModalComponent
              isOpen={isKeyModalOpen}
              onClose={() => setIsKeyModalOpen(false)}
              currentKey={apiKey}
              isConnected={isConnected}
              onConnect={handleConnectKey}
              onDisconnect={handleDisconnect}
            />
          )}

          {/* ========================================================= */}
          {/* CODE EXPORT MODAL                                         */}
          {/* ========================================================= */}
          {isCodeModalOpen && (
            <CodeExportModalComponent
              isOpen={isCodeModalOpen}
              onClose={() => setIsCodeModalOpen(false)}
              model={selectedModel}
              systemPrompt={systemPrompt}
              examples={examples}
              userPrompt={userPrompt}
              parameters={parameters}
            />
          )}

        </div>
      );
    }

    // --- API KEY MODAL COMPONENT ---
    function ApiKeyModalComponent({ isOpen, onClose, currentKey, isConnected, onConnect, onDisconnect }) {
      const [inputKey, setInputKey] = useState(currentKey);
      const [showKey, setShowKey] = useState(false);
      const [isValidating, setIsValidating] = useState(false);
      const [errorMsg, setErrorMsg] = useState(null);
      const [successMsg, setSuccessMsg] = useState(null);

      const handleSubmit = async (e) => {
        if (e) e.preventDefault();
        setErrorMsg(null);
        setSuccessMsg(null);
        setIsValidating(true);

        const res = await onConnect(inputKey);
        setIsValidating(false);

        if (res.success) {
          setSuccessMsg('API key verified and connected successfully!');
          setTimeout(() => {
            onClose();
          }, 900);
        } else {
          setErrorMsg(res.error || 'Failed to validate API key.');
        }
      };

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-sm">
          <div className="relative w-full max-w-lg bg-[#0e1017] border border-groq-border rounded-xl shadow-2xl overflow-hidden">
            
            {/* Modal Header */}
            <div className="flex items-center justify-between px-6 py-4 bg-[#141724] border-b border-groq-border">
              <div className="flex items-center gap-2.5">
                <div className="w-8 h-8 rounded-lg bg-orange-500/10 border border-orange-500/20 flex items-center justify-center">
                  <IconKey className="w-4 h-4 text-orange-400" />
                </div>
                <div>
                  <h3 className="text-sm font-bold text-white">Connect Groq API Key</h3>
                  <p className="text-xs text-gray-400">Direct client connection to GroqCloud</p>
                </div>
              </div>
              {isConnected && (
                <button onClick={onClose} className="p-1 rounded text-gray-400 hover:text-white hover:bg-gray-800 transition-colors">
                  <IconClose className="w-4 h-4" />
                </button>
              )}
            </div>

            {/* Modal Body */}
            <div className="p-6 space-y-4">
              
              {/* Security Banner */}
              <div className="flex items-start gap-3 p-3 rounded-lg bg-[#121624] border border-blue-500/20 text-xs text-gray-300">
                <IconShieldCheck className="w-4 h-4 text-blue-400 shrink-0 mt-0.5" />
                <div className="space-y-0.5">
                  <span className="font-semibold text-blue-300">In-Memory Session Security:</span>
                  <p className="text-gray-400 leading-relaxed">
                    Your key is kept strictly in-memory during this browser session. It is never logged, never hardcoded, and never stored permanently.
                  </p>
                </div>
              </div>

              <form onSubmit={handleSubmit} className="space-y-3.5">
                <div>
                  <label className="block text-xs font-semibold uppercase tracking-wider text-gray-300 mb-1.5">
                    Groq API Key
                  </label>
                  <div className="relative">
                    <input
                      type={showKey ? 'text' : 'password'}
                      value={inputKey}
                      onChange={(e) => {
                        setInputKey(e.target.value);
                        if (errorMsg) setErrorMsg(null);
                      }}
                      placeholder="gsk_..."
                      autoFocus
                      className="w-full px-3.5 py-2.5 pr-10 bg-[#161a26] border border-groq-border rounded-lg text-xs text-white placeholder-gray-500 focus:outline-none focus:border-orange-500 font-mono"
                    />
                    <button
                      type="button"
                      onClick={() => setShowKey(!showKey)}
                      className="absolute right-2.5 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-200"
                    >
                      {showKey ? <IconEyeOff className="w-4 h-4" /> : <IconEye className="w-4 h-4" />}
                    </button>
                  </div>
                  <p className="mt-1.5 text-[11px] text-gray-400">
                    Don't have a key? Create one for free at{' '}
                    <a href="https://console.groq.com/keys" target="_blank" rel="noreferrer" className="text-orange-400 hover:underline inline-flex items-center gap-0.5">
                      console.groq.com/keys <IconExternalLink className="w-3 h-3" />
                    </a>
                  </p>
                </div>

                {/* Error Banner */}
                {errorMsg && (
                  <div className="flex items-start gap-2 p-3 rounded-lg bg-red-500/10 border border-red-500/30 text-xs text-red-300">
                    <IconAlert className="w-4 h-4 text-red-400 shrink-0 mt-0.5" />
                    <span>{errorMsg}</span>
                  </div>
                )}

                {/* Success Banner */}
                {successMsg && (
                  <div className="flex items-center gap-2 p-3 rounded-lg bg-emerald-500/10 border border-emerald-500/30 text-xs text-emerald-300">
                    <IconCheck className="w-4 h-4 text-emerald-400 shrink-0" />
                    <span>{successMsg}</span>
                  </div>
                )}

                {/* Action Buttons */}
                <div className="flex items-center justify-between pt-2">
                  {isConnected ? (
                    <button
                      type="button"
                      onClick={() => {
                        setInputKey('');
                        onDisconnect();
                      }}
                      className="px-3 py-1.5 text-xs font-medium text-red-400 hover:text-red-300 hover:bg-red-500/10 rounded-lg border border-red-500/20"
                    >
                      Disconnect Key
                    </button>
                  ) : <div />}

                  <div className="flex items-center gap-2">
                    {isConnected && (
                      <button
                        type="button"
                        onClick={onClose}
                        className="px-3.5 py-2 text-xs font-medium text-gray-300 hover:text-white hover:bg-gray-800 rounded-lg"
                      >
                        Cancel
                      </button>
                    )}
                    <button
                      type="submit"
                      disabled={isValidating || !inputKey.trim()}
                      className="flex items-center gap-2 px-5 py-2 text-xs font-bold text-white gradient-groq hover:brightness-110 active:scale-95 disabled:opacity-40 disabled:cursor-not-allowed rounded-lg shadow-lg shadow-orange-500/20 transition-all cursor-pointer"
                    >
                      {isValidating ? (
                        <>
                          <span className="w-3 h-3 rounded-full border-2 border-white border-t-transparent animate-spin"></span>
                          Validating with Groq...
                        </>
                      ) : (
                        <>
                          <IconKey className="w-3.5 h-3.5" />
                          {isConnected ? 'Update & Validate' : 'Connect API Key'}
                        </>
                      )}
                    </button>
                  </div>
                </div>

              </form>
            </div>
          </div>
        </div>
      );
    }

    // --- CODE EXPORT MODAL COMPONENT ---
    function CodeExportModalComponent({ isOpen, onClose, model, systemPrompt, examples, userPrompt, parameters }) {
      const [activeTab, setActiveTab] = useState('python');
      const [copied, setCopied] = useState(false);

      const messagesList = [];
      if (systemPrompt.trim()) {
        messagesList.push({ role: 'system', content: systemPrompt.trim() });
      }
      examples.forEach(ex => {
        if (ex.userInput.trim() && ex.assistantResponse.trim()) {
          messagesList.push({ role: 'user', content: ex.userInput.trim() });
          messagesList.push({ role: 'assistant', content: ex.assistantResponse.trim() });
        }
      });
      messagesList.push({ role: 'user', content: userPrompt.trim() || 'Your prompt question here...' });

      const pythonCode = `import os
from groq import Groq

client = Groq(
    api_key=os.environ.get("GROQ_API_KEY"),
)

completion = client.chat.completions.create(
    model="${model}",
    messages=${JSON.stringify(messagesList, null, 4)},
    temperature=${parameters.temperature},
    max_tokens=${parameters.maxTokens},
    top_p=${parameters.topP},
    frequency_penalty=${parameters.frequencyPenalty},
    presence_penalty=${parameters.presencePenalty},
    stream=${parameters.stream ? 'True' : 'False'},
)

${parameters.stream ? `for chunk in completion:
    print(chunk.choices[0].delta.content or "", end="")` : `print(completion.choices[0].message.content)`}`;

      const jsCode = `import Groq from "groq-sdk";

const groq = new Groq({
  apiKey: process.env.GROQ_API_KEY,
});

async function main() {
  const completion = await groq.chat.completions.create({
    model: "${model}",
    messages: ${JSON.stringify(messagesList, null, 4)},
    temperature: ${parameters.temperature},
    max_tokens: ${parameters.maxTokens},
    top_p: ${parameters.topP},
    frequency_penalty: ${parameters.frequencyPenalty},
    presence_penalty: ${parameters.presencePenalty},
    stream: ${parameters.stream},
  });

  ${parameters.stream ? `for await (const chunk of completion) {
    process.stdout.write(chunk.choices[0]?.delta?.content || "");
  }` : `console.log(completion.choices[0]?.message?.content);`}
}

main().catch(console.error);`;

      const curlCode = `curl https://api.groq.com/openai/v1/chat/completions \\
  -H "Authorization: Bearer $GROQ_API_KEY" \\
  -H "Content-Type: application/json" \\
  -d '${JSON.stringify({
    model,
    messages: messagesList,
    temperature: parameters.temperature,
    max_tokens: parameters.maxTokens,
    top_p: parameters.topP,
    frequency_penalty: parameters.frequencyPenalty,
    presence_penalty: parameters.presencePenalty,
    stream: parameters.stream
  }, null, 2)}'`;

      const currentCode = activeTab === 'python' ? pythonCode : activeTab === 'javascript' ? jsCode : curlCode;

      const handleCopy = () => {
        navigator.clipboard.writeText(currentCode);
        setCopied(true);
        setTimeout(() => setCopied(false), 2000);
      };

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-sm">
          <div className="relative w-full max-w-2xl bg-[#0e1017] border border-groq-border rounded-xl shadow-2xl overflow-hidden flex flex-col max-h-[85vh]">
            
            <div className="flex items-center justify-between px-6 py-4 bg-[#141724] border-b border-groq-border">
              <div className="flex items-center gap-2">
                <IconCode className="w-4 h-4 text-purple-400" />
                <h3 className="text-sm font-bold text-white">Export Code Snippet</h3>
              </div>
              <button onClick={onClose} className="p-1 rounded text-gray-400 hover:text-white hover:bg-gray-800">
                <IconClose className="w-4 h-4" />
              </button>
            </div>

            <div className="flex items-center justify-between px-6 py-2.5 bg-[#12141e] border-b border-groq-border">
              <div className="flex items-center gap-2">
                <button
                  onClick={() => setActiveTab('python')}
                  className={`px-3 py-1 rounded-lg text-xs font-semibold ${
                    activeTab === 'python' ? 'bg-orange-500/20 text-orange-400 border border-orange-500/40' : 'text-gray-400 hover:text-white'
                  }`}
                >
                  Python
                </button>
                <button
                  onClick={() => setActiveTab('javascript')}
                  className={`px-3 py-1 rounded-lg text-xs font-semibold ${
                    activeTab === 'javascript' ? 'bg-orange-500/20 text-orange-400 border border-orange-500/40' : 'text-gray-400 hover:text-white'
                  }`}
                >
                  JavaScript
                </button>
                <button
                  onClick={() => setActiveTab('curl')}
                  className={`px-3 py-1 rounded-lg text-xs font-semibold ${
                    activeTab === 'curl' ? 'bg-orange-500/20 text-orange-400 border border-orange-500/40' : 'text-gray-400 hover:text-white'
                  }`}
                >
                  cURL
                </button>
              </div>

              <button
                onClick={handleCopy}
                className="flex items-center gap-1.5 px-3 py-1 rounded bg-gray-800 hover:bg-gray-700 text-xs font-medium text-gray-200 transition-colors"
              >
                {copied ? (
                  <>
                    <IconCheck className="w-3.5 h-3.5 text-emerald-400" />
                    <span className="text-emerald-400">Copied</span>
                  </>
                ) : (
                  <>
                    <IconCopy className="w-3.5 h-3.5" />
                    <span>Copy Code</span>
                  </>
                )}
              </button>
            </div>

            <div className="flex-1 p-6 overflow-y-auto bg-[#090a0f]">
              <pre className="p-4 rounded-lg bg-[#0e1018] border border-groq-border font-mono text-xs text-orange-300/90 overflow-x-auto leading-relaxed">
                <code>{currentCode}</code>
              </pre>
            </div>

            <div className="px-6 py-3 bg-[#141724] border-t border-groq-border text-[11px] text-gray-400 flex justify-between">
              <span>Model: <strong className="text-white">{model}</strong></span>
              <span>Requires <code className="text-orange-400">GROQ_API_KEY</code></span>
            </div>
          </div>
        </div>
      );
    }

    // Render the App
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
